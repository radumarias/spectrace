name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  web:
    name: Web (tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci --no-audit --no-fund

      - name: Lint (npm run lint, when the script exists)
        run: |
          if node -e "process.exit(require('./web/package.json').scripts?.lint ? 0 : 1)"; then
            npm --prefix web run lint
          else
            echo "No lint script in web/package.json, skipping"
          fi

      - name: Tests
        run: npm --prefix web test

      - name: Build (web app plus Worker, as deployed)
        run: npm --prefix web run build

  worker:
    name: Worker (tsc, eslint, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Lint (tsc, eslint)
        run: npm --prefix worker run lint

      - name: Tests (workerd via Miniflare, no Cloudflare account needed)
        run: npm --prefix worker test
