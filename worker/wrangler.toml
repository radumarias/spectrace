name = "spectrace"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The web app is served from the same origin as the API (Workers Static Assets).
# Only /api/* runs the Worker; everything else is a static file or the SPA index.
# In `just dev` and `vite build` the Cloudflare Vite plugin supplies the real
# client build directory, so the `directory` below only matters for `wrangler dev`.
[assets]
directory = "../web/dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/d/*", "/__devpage/*"]

[[d1_databases]]
binding = "DB"
database_name = "spectrace"
# Local development uses a throwaway database; the real id is set at deploy time.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
LOG_FORMAT = "json"

# Job queue (T1.5): this Worker produces and consumes. A message that is still
# failing after `max_retries` deliveries goes to the dead-letter queue, whose
# consumer marks the job failed.
[[queues.producers]]
binding = "JOBS"
queue = "spectrace-jobs"

[[queues.consumers]]
queue = "spectrace-jobs"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 10
dead_letter_queue = "spectrace-jobs-dlq"

[[queues.consumers]]
queue = "spectrace-jobs-dlq"

# One ProjectHub per project streams job events to browsers over WebSockets.
[[durable_objects.bindings]]
name = "PROJECT_HUB"
class_name = "ProjectHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectHub"]

# devpage server (radumarias/devpage) renders the specs: one container, since
# its store is one SQLite file (Litestream keeps it in the bucket). It is used
# only once DEVPAGE_BUCKET_URL is set; see docs/deploy.md and src/devpage.ts.
[[containers]]
class_name = "DevpageServer"
image = "../containers/devpage/Dockerfile"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "DEVPAGE"
class_name = "DevpageServer"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DevpageServer"]

# `just dev` and the tests need no Docker: the container is never built
# locally. Point DEVPAGE_ORIGIN at a `devpage server` in .dev.vars to try it.
[dev]
enable_containers = false
