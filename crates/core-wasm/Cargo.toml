[package]
name = "spectrace-core-wasm"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen wrapper that exposes spectrace-core to the Worker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spectrace-core = { path = "../core", features = ["serde"] }
# Pinned: `just wasm` installs the CLI at this exact version (the glue must match).
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[lints]
workspace = true
