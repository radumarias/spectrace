name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spectrace
          POSTGRES_PASSWORD: spectrace
          POSTGRES_DB: spectrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spectrace"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://spectrace:spectrace@localhost:5432/spectrace
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  web:
    name: Web (tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci --no-audit --no-fund

      - name: Lint (npm run lint, when the script exists)
        run: |
          if node -e "process.exit(require('./web/package.json').scripts?.lint ? 0 : 1)"; then
            npm --prefix web run lint
          else
            echo "No lint script in web/package.json, skipping"
          fi

      - name: Tests
        run: npm --prefix web test
