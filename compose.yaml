services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: spectrace
      POSTGRES_PASSWORD: spectrace
      POSTGRES_DB: spectrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectrace"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
